<svg xmlns="http://www.w3.org/2000/svg" width="900" height="752" viewBox="0 0 900 752" role="img" aria-labelledby="document-run-title document-run-desc">
<title id="document-run-title">A document run</title>
<desc id="document-run-desc">answer_document() runs 3 stages in order: ingest with gr_ingest(), which hands on a gr_document; segment with gr_segment(), which hands on a gr_chunks; read with gr_read(), which hands on a gr_answer. Segmenters and readers that declare model calls send each request through hr_call(): the governor checks allowed_models, max_output_tokens, max_calls, reserve_calls; the cache answers a repeat; on a miss the governor checks max_tokens_total, max_cost_usd, allow_unpriced, reserve_usd; the client answers it; trace_record() adds a step. Readers size prompts with hr_budget(). One trace from hr_trace() goes to every stage.</desc>
<defs>
<marker id="document-run-arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
<marker id="document-run-arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
<marker id="document-run-arrow-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
<marker id="document-run-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker>
</defs>
<rect width="900" height="752" rx="14" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" fill="#1f2328">
<text x="24" y="36" font-size="20" font-weight="bold">A document run</text>
<text x="24" y="60" fill="#57606a">answer_document() runs the stages of gr_recipe() in order: ingest, segment, read.</text>
<rect x="24" y="84" width="400" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="224" y="108.6" text-anchor="middle">source: a file path, a URL or text</text>
<path d="M144 124 L144 164" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="24" y="164" width="400" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="224" y="191.6" font-size="15" text-anchor="middle" font-weight="bold" fill="#116329" class="stage">ingest</text>
<text x="224" y="209.1" font-size="13" text-anchor="middle" class="fn">gr_ingest(source, spec, cache, trace)</text>
<text x="224" y="226" font-size="13" text-anchor="middle" fill="#57606a">extractors and cleaners declare no model calls</text>
<text x="224" y="242.9" font-size="13" text-anchor="middle" fill="#57606a">cache_documents = TRUE keeps a session cache</text>
<path d="M144 260 L144 300" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<text x="156" y="286" font-weight="bold" class="object">gr_document</text>
<rect x="24" y="300" width="400" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="224" y="327.6" font-size="15" text-anchor="middle" font-weight="bold" fill="#116329" class="stage">segment</text>
<text x="224" y="345.1" font-size="13" text-anchor="middle" class="fn">gr_segment(doc, spec, client, trace)</text>
<text x="224" y="362" font-size="13" text-anchor="middle" fill="#57606a">segmenters that declare model calls:</text>
<text x="224" y="378.9" font-size="13" text-anchor="middle" fill="#57606a">contextual, proposition</text>
<path d="M144 396 L144 436" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<text x="156" y="422" font-weight="bold" class="object">gr_chunks</text>
<rect x="24" y="436" width="400" height="79" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="224" y="463.6" font-size="15" text-anchor="middle" font-weight="bold" fill="#116329" class="stage">read</text>
<text x="224" y="481.1" font-size="13" text-anchor="middle" class="fn">gr_read(chunks, question, client, spec, trace)</text>
<text x="224" y="498" font-size="13" text-anchor="middle" fill="#57606a">every reader declares model calls</text>
<path d="M144 515 L144 555" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<text x="156" y="541" font-weight="bold" class="object">gr_answer</text>
<rect x="24" y="555" width="400" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="224" y="581.6" text-anchor="middle">the answer: $answer, $evidence, $trace</text>
<rect x="464" y="84" width="412" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="108.6" text-anchor="middle" font-weight="bold" class="fn">each model request: hr_call()</text>
<path d="M424 348 L444 348" fill="none" stroke="#8c959f" stroke-width="1.75"/>
<path d="M424 475.5 L444 475.5 L444 104 L464 104" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<path d="M670 124 L670 144" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="464" y="144" width="412" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="163.7" text-anchor="middle" font-weight="bold">1. governor, before the cache</text>
<text x="670" y="180.9" font-size="13" text-anchor="middle" class="limits-call">allowed_models, max_output_tokens, max_calls,</text>
<text x="670" y="197.8" font-size="13" text-anchor="middle" class="limits-call">reserve_calls</text>
<path d="M670 208 L670 228" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="464" y="228" width="412" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="252.2" text-anchor="middle" font-weight="bold">2. cache: hr_cache_client()</text>
<text x="670" y="269.4" font-size="13" text-anchor="middle">a hit is returned; nothing is sent</text>
<path d="M670 284 L670 304" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="464" y="304" width="412" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="323.7" text-anchor="middle" font-weight="bold">3. governor, on a cache miss</text>
<text x="670" y="340.9" font-size="13" text-anchor="middle" class="limits-send">max_tokens_total, max_cost_usd, allow_unpriced,</text>
<text x="670" y="357.8" font-size="13" text-anchor="middle" class="limits-send">reserve_usd</text>
<path d="M670 368 L670 388" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="464" y="388" width="412" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="670" y="412.2" text-anchor="middle" font-weight="bold">4. the client answers it</text>
<text x="670" y="429.4" font-size="13" text-anchor="middle">a provider over HTTP, a mock or a replay</text>
<path d="M670 444 L670 464" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#document-run-arrow-neutral)"/>
<rect x="464" y="464" width="412" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="488.2" text-anchor="middle" font-weight="bold" class="fn">5. trace_record()</text>
<text x="670" y="505.4" font-size="13" text-anchor="middle">adds the call as a step of the trace</text>
<text x="464" y="546" font-size="13" fill="#57606a">A refused request is not sent; hr_governor()</text>
<text x="464" y="564" font-size="13" fill="#57606a">sets the limits for the run.</text>
<rect x="464" y="584" width="412" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="670" y="602.7" text-anchor="middle" font-weight="bold" class="fn">budget: hr_budget()</text>
<text x="670" y="619.9" font-size="13" text-anchor="middle">readers fit each prompt to the model's</text>
<text x="670" y="636.8" font-size="13" text-anchor="middle">context window</text>
<rect x="24" y="670" width="852" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="450" y="697.2" text-anchor="middle" font-weight="bold" class="fn">trace: one gr_trace from hr_trace() goes to every stage</text>
<text x="450" y="714.4" font-size="13" text-anchor="middle">A &quot;fast&quot; run of gr_example() records: ingest, segment, preflight, stuff.answer</text>
</g>
</svg>
