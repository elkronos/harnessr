<svg xmlns="http://www.w3.org/2000/svg" width="900" height="756" viewBox="0 0 900 756" role="img" aria-labelledby="layers-title layers-desc">
<title id="layers-title">harnessr: a core and a document layer</title>
<desc id="layers-desc">Two stacked layers. The core (hr_ functions: calls and clients, trace, models and prices, context, effort, limits, cache and replay, composing, evaluating, registry and modules) sends every request to a model provider or a stand-in: hr_client(), hr_ellmer_client(), hr_backend_client(), hr_mock_client(), hr_replay_client(). The document layer (gr_ functions: ingest, segment, read, screen, extract, claims, synthesis, review) sits above it and calls the core. Your R code calls either layer. The core never calls the document layer; tests/testthat/test-boundary.R checks that.</desc>
<defs>
<marker id="layers-arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
<marker id="layers-arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
<marker id="layers-arrow-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
<marker id="layers-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker>
</defs>
<rect width="900" height="756" rx="14" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" fill="#1f2328">
<text x="24" y="36" font-size="20" font-weight="bold">harnessr: a core and a document layer</text>
<text x="24" y="60" fill="#57606a">The core sends every model request. The document layer builds on it; calls go down.</text>
