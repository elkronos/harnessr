url: https://elkronos.github.io/harnessr/

template:
  bootstrap: 5

articles:
- title: Get started
  desc: >
    The ideas, installing, connecting a model, and a first question checked
    from start to finish.
  contents:
  - harnessr

- title: Core
  navbar: Core
  desc: >
    Calls and clients without a document: what a call returns, the trace
    that records it, structured replies, checks on a reply, signals and
    errors by class.
  contents:
  - core

- title: Read a document
  navbar: Read a document
  desc: >
    Get text out of a file, cut it into chunks, and choose how the model
    reads them.
  contents:
  - ingest
  - segment
  - readers

- title: Review many documents
  navbar: Review many documents
  desc: >
    Ask one question of many documents, or run a literature review from a
    search export to an audit report.
  contents:
  - review

- title: Measure and compare
  navbar: Measure and compare
  desc: >
    Score configurations against labelled answers and compare readers,
    segmenters and settings with intervals.
  contents:
  - evaluate
  - compare

- title: Control cost and settings
  navbar: Control cost and settings
  desc: >
    Set model prices and spending limits, pay for a request once, replay a
    run, and look up every setting with its default.
  contents:
  - runs
  - settings

- title: Build your own
  navbar: Build your own
  desc: >
    Chain steps of your own into a run, and register extractors, segmenters,
    readers and other modules.
  contents:
  - compose
  - extending

- title: Upgrade
  navbar: Upgrade
  desc: >
    Change code written for readgpt or an older harnessr to the current
    names.
  contents:
  - migrate

reference:
- title: Ask a question
  desc: >
    Start here. One call reads a document and answers a question, and the
    answer says what it rests on and whether anything went wrong. See
    `vignette("harnessr")`.
  contents:
  - answer_document
  - gr_answer
  - is_not_found
  - gr_example
  - gr_recipes
  - gr_recipe
  - gr_compare

- title: Connect to a model
  desc: >
    Clients for OpenAI-compatible endpoints, any provider ellmer supports, any
    function you write, and an offline stand-in for practice and tests. See
    `vignette("core")`, `vignette("harnessr")` and the README.
  contents:
  - hr_client
  - hr_api_key
  - hr_ellmer_client
  - hr_backend_client
  - hr_mock_client
  - hr_call
  - gr_result
  - hr_models
  - hr_model_info
  - hr_model_limits
  - hr_register_model
  - hr_load_models

- title: Get text out of files
  desc: >
    Extraction, cleaning and a survey of a folder before anything is spent.
    See `vignette("ingest")`.
  contents:
  - gr_ingest
  - gr_ingest_spec
  - gr_document
  - gr_extractors
  - gr_cleaners
  - gr_clean
  - gr_inventory

- title: Cut documents into chunks
  desc: >
    The segmenters, their settings, and the free statistics for comparing
    chunkings: size, boundary error against a reference (Pk and WindowDiff)
    and retrieval recall. See `vignette("segment")` and `vignette("compare")`.
  contents:
  - gr_segment
  - gr_segment_spec
  - gr_segmenters
  - gr_chunks
  - gr_chunk_stats
  - gr_seg_boundaries
  - gr_seg_pk
  - gr_seg_recall

- title: Read the chunks
  desc: >
    The reading strategies, the settings that choose and place chunks, and
    the check on quoted evidence. See `vignette("readers")`.
  contents:
  - gr_read
  - gr_read_spec
  - gr_readers
  - gr_reader_signature
  - hr_embed
  - gr_embedders
  - gr_verify_evidence

- title: Many documents and literature reviews
  desc: >
    One question over many documents, and a review from a search export to
    screened studies, an extraction table, a written review and an audit
    report, with the screening measured against a hand-screened sample. See
    `vignette("review")`.
  contents:
  - gr_read_many
  - gr_protocol
  - gr_protocols
  - gr_protocol_save
  - gr_register_protocol
  - gr_search
  - gr_records
  - gr_search_recall
  - gr_screen
  - gr_reference
  - gr_reference_consensus
  - gr_calibrate
  - gr_screen_sample_size
  - gr_resolve
  - '`[.gr_reference_frame`'
  - gr_fields
  - gr_field
  - gr_extract
  - gr_extract_agreement
  - gr_claims
  - gr_outline
  - gr_outline_pick
  - gr_gaps
  - gr_synthesise
  - gr_recheck
  - gr_flow
  - gr_audit_report

- title: Cost, limits and tracing
  desc: >
    Settings and spending limits, token counts and cost estimates, and the
    trace every run records. See `vignette("runs")`.
  contents:
  - hr_options
  - hr_governor
  - hr_estimate_cost
  - hr_count_tokens
  - hr_tokenizer
  - hr_set_tokenizer
  - hr_truncate_tokens
  - hr_truncate
  - hr_context_policy
  - hr_context_fit
  - hr_effort_escalate
  - hr_effort_event
  - hr_effort_log
  - hr_budget
  - hr_trace
  - hr_trace_summary
  - hr_trace_cost
  - hr_trace_save
  - as_json
  - gr_methods_text

- title: Caching and replaying runs
  desc: >
    Paying for a request once, and replaying a recorded run without a model.
    See `vignette("runs")`.
  contents:
  - hr_cache
  - hr_cache_client
  - hr_cache_stats
  - hr_cache_clear
  - gr_flush_caches
  - hr_replay_client

- title: Statistics
  desc: >
    Intervals for proportions, agreement between raters and coders,
    design-weighted and prediction-powered estimates, and the test of whether
    a model's labels can stand in for people's. See `vignette("evaluate")`.
  contents:
  - hr_prop_ci
  - hr_agreement
  - hr_ht_estimate
  - hr_ppi
  - hr_alt_test

- title: Benchmarks
  desc: >
    Compare configurations on a labelled reference: arms, sweeps of a
    setting, the reference and its splits, scorers, and repeated runs held to
    one spending limit. See `vignette("evaluate")` and `vignette("compare")`.
  contents:
  - hr_benchmark
  - hr_report
  - hr_error_correlation
  - hr_mdd
  - hr_contrast
  - hr_drift_check
  - hr_arm
  - hr_sweep
  - hr_sweep_check
  - hr_effort_check
  - hr_reference
  - hr_scorer
  - gr_arm
  - gr_qa_reference
  - gr_scorer_answer
  - gr_condensation_check
  - gr_reverse_text

- title: Compose steps and chains
  desc: >
    Build a run from steps (ingest, segment, retrieve, read, or a function of
    your own), run them in order as one arm, derive a chain by dropping or
    replacing a step, list, change and sweep its settings by path, give a
    step a skill, and check a step's output by running a program. See
    `vignette("compose")` and `vignette("evaluate")`.
  contents:
  - hr_step
  - hr_chain
  - hr_settings
  - hr_set
  - hr_step_command
  - hr_skill
  - gr_step

- title: Baselines
  desc: >
    Comparisons that use no model: tf-idf features, a cross-fitted classifier,
    a simulated active-learning ranker for screening, and the stopping test for
    prioritised screening. See `vignette("evaluate")`, and `vignette("review")`
    for the stopping test.
  contents:
  - hr_tfidf
  - hr_baseline_classifier
  - hr_baseline_ranker
  - gr_stop_test

- title: Judges
  desc: >
    A model that chooses between candidates or grades one against a
    reference, asked in both orders, validated against blind human labels
    before it scores, with its accuracy corrected by those labels. See
    `vignette("evaluate")`.
  contents:
  - hr_judge
  - hr_judge_config
  - hr_judge_validate
  - hr_scorer_judge
  - hr_judge_ppi

- title: Signals and calibration
  desc: >
    Values the package records about its own work, the calibration records
    that measure how well they predict being right, and the thresholds and
    policy that decide whether a signal may gate an action. Nothing gates by
    default. See `vignette("evaluate")`.
  contents:
  - hr_signal
  - hr_calibrate_signal
  - hr_calibration_valid
  - hr_gate_threshold
  - hr_signal_policy

- title: Reference sets and splits
  desc: >
    Splitting reference items into tuning, calibration and test sets by
    document, and the sheets people fill in to label them. See
    `vignette("evaluate")`.
  contents:
  - hr_assign_splits
  - gr_label_sheet
  - gr_read_labels

- title: Extending harnessr
  desc: >
    Every axis is a registry, and an addition is used exactly like a
    built-in. `hr_register()` and `hr_modules()` register and list modules
    of any kind. See `vignette("extending")`.
  contents:
  - gr_register_extractor
  - gr_register_cleaner
  - gr_register_segmenter
  - gr_register_reader
  - gr_register_embedder
  - hr_register
  - hr_modules
  - new_chunks
  - new_answer
  - hr_cost
  - gr_settings
  - gr_settings_table
  - hr_schema
  - hr_param
  - hr_validate
  - hr_check_module
  - gr_check_reader
  - gr_check_segmenter
