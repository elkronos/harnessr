url: https://elkronos.github.io/readgpt/

template:
  bootstrap: 5

articles:
- title: Get started
  desc: >
    The ideas, installing, connecting a model, and a first question checked
    from start to finish.
  contents:
  - harnessr

- title: Guides
  navbar: Guides
  desc: >
    One guide per topic, in the order a run uses them.
  contents:
  - ingest
  - segment
  - readers
  - review
  - runs
  - extending

reference:
- title: Ask a question
  desc: >
    Start here. One call reads a document and answers a question, and the
    answer says what it rests on and whether anything went wrong. See
    `vignette("harnessr")`.
  contents:
  - answer_document
  - gr_answer
  - is_not_found
  - gr_example
  - gr_recipes
  - gr_recipe
  - gr_compare

- title: Connect to a model
  desc: >
    Clients for OpenAI-compatible endpoints, any provider ellmer supports, any
    function you write, and an offline stand-in for practice and tests. See
    `vignette("harnessr")` and the README.
  contents:
  - gr_client
  - gr_api_key
  - gr_ellmer_client
  - gr_backend_client
  - gr_mock_client
  - gr_call
  - gr_result
  - gr_models
  - gr_model_info
  - gr_model_limits
  - gr_register_model

- title: Get text out of files
  desc: >
    Extraction, cleaning and a survey of a folder before anything is spent.
    See `vignette("ingest")`.
  contents:
  - gr_ingest
  - gr_ingest_spec
  - gr_document
  - gr_extractors
  - gr_cleaners
  - gr_clean
  - gr_inventory

- title: Cut documents into chunks
  desc: >
    The segmenters, their settings, and the free statistics for comparing
    chunkings. See `vignette("segment")`.
  contents:
  - gr_segment
  - gr_segment_spec
  - gr_segmenters
  - gr_chunks
  - gr_chunk_stats

- title: Read the chunks
  desc: >
    The reading strategies, the settings that choose and place chunks, and
    the check on quoted evidence. See `vignette("readers")`.
  contents:
  - gr_read
  - gr_read_spec
  - gr_readers
  - gr_reader_signature
  - gr_embed
  - gr_embedders
  - gr_verify_evidence

- title: Many documents and literature reviews
  desc: >
    One question over many documents, and a review from a search export to
    screened studies, an extraction table, a written review and an audit
    report, with the screening measured against a hand-screened sample. See
    `vignette("review")`.
  contents:
  - gr_read_many
  - gr_protocol
  - gr_protocols
  - gr_protocol_save
  - gr_register_protocol
  - gr_search
  - gr_records
  - gr_screen
  - gr_reference
  - gr_calibrate
  - gr_resolve
  - '`[.gr_reference_frame`'
  - gr_fields
  - gr_field
  - gr_extract
  - gr_claims
  - gr_outline
  - gr_outline_pick
  - gr_gaps
  - gr_synthesise
  - gr_flow
  - gr_audit_report

- title: Cost, limits and tracing
  desc: >
    Settings and spending limits, token counts and cost estimates, and the
    trace every run records. See `vignette("runs")`.
  contents:
  - gr_options
  - hr_governor
  - gr_estimate_cost
  - gr_count_tokens
  - gr_tokenizer
  - gr_set_tokenizer
  - gr_truncate_tokens
  - gr_budget
  - gr_trace
  - gr_trace_summary
  - gr_trace_cost
  - gr_trace_save
  - as_json

- title: Caching and replaying runs
  desc: >
    Paying for a request once, and replaying a recorded run without a model.
    See `vignette("runs")`.
  contents:
  - gr_cache
  - gr_cache_client
  - gr_cache_stats
  - gr_cache_clear
  - gr_flush_caches
  - gr_replay_client

- title: Extending harnessr
  desc: >
    Every axis is a registry, and an addition is used exactly like a
    built-in. See `vignette("extending")`.
  contents:
  - gr_register_extractor
  - gr_register_cleaner
  - gr_register_segmenter
  - gr_register_reader
  - gr_register_embedder
  - new_chunks
  - new_answer
  - hr_cost
  - hr_schema
  - hr_param
  - hr_validate
  - hr_check_module
  - gr_check_reader
  - gr_check_segmenter

- title: Superseded
  desc: >
    The entry points of the first version, and the old name of `gr_example()`.
    They still work and warn once; new code should use `answer_document()`,
    `gr_ingest()`, `gr_segment()` and `gr_example()`. The README's "Migrating
    from v1" section maps each one.
  contents:
  - answer_question
  - parse_text
  - gpt_read_chunked
  - gpt_read_hierarchical
  - gpt_read_multipass
  - gpt_read_retrieval
  - readgpt_example
