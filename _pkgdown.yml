url: https://elkronos.github.io/harnessr/

template:
  bootstrap: 5

articles:
- title: Get started
  desc: >
    The ideas, installing, connecting a model, and a first question checked
    from start to finish.
  contents:
  - harnessr

- title: Core
  navbar: Core
  desc: >
    Model calls with or without a document. What a call returns and the trace
    that records it; the model registry, the prices you set and token counts;
    keeping a prompt inside the context window; how hard a reasoning model
    reasons; spending limits, the cache and replay; composing steps into
    chains; measuring and comparing configurations; and every setting with
    its default.
  contents:
  - core
  - models
  - context
  - effort
  - runs
  - compose
  - evaluate
  - compare
  - settings

- title: Documents
  navbar: Documents
  desc: >
    The document layer, built on the core. Get text out of a file, cut it
    into chunks, choose how the model reads them, review many documents from
    a search export to an audit report, and register document modules of
    your own.
  contents:
  - ingest
  - segment
  - readers
  - review
  - extending

- title: Upgrade
  navbar: Upgrade
  desc: >
    Change code written for readgpt or an older harnessr to the current
    names.
  contents:
  - migrate

reference:
- title: Core
  desc: >
    The harness for model calls, with or without a document: calls and
    clients, models and prices, context, effort, limits, caching and replay,
    composition and measurement. The groups follow the core guides in order,
    starting with `vignette("core")`.

- subtitle: Calls, clients and results
  desc: >
    One call to a model, the result it returns and the trace that records it.
    Clients for OpenAI-compatible endpoints, any provider ellmer supports, any
    function you write, and an offline stand-in for practice and tests.
    Signals a run records about its own work, and the schemas that check
    settings. See `vignette("core")`.
  contents:
  - hr_call
  - gr_result
  - hr_client
  - hr_api_key
  - hr_ellmer_client
  - hr_backend_client
  - hr_mock_client
  - hr_embed
  - hr_trace
  - hr_trace_summary
  - hr_trace_cost
  - hr_trace_save
  - as_json
  - hr_signal
  - hr_param
  - hr_schema
  - hr_validate

- subtitle: Models, prices and tokens
  desc: >
    The model registry, the prices you set, cost estimates and token counts.
    See `vignette("models")`.
  contents:
  - hr_models
  - hr_model_info
  - hr_model_limits
  - hr_register_model
  - hr_load_models
  - hr_estimate_cost
  - hr_count_tokens
  - hr_tokenizer
  - hr_set_tokenizer

- subtitle: Context
  desc: >
    How much room a prompt has, fitting its pieces into that room, and cutting
    one piece. See `vignette("context")`.
  contents:
  - hr_budget
  - hr_context_fit
  - hr_context_policy
  - hr_truncate
  - hr_truncate_tokens

- subtitle: Effort
  desc: >
    Raising reasoning effort when a stage goes wrong, the log of each raise,
    and checking whether more effort pays. See `vignette("effort")`.
  contents:
  - hr_effort_escalate
  - hr_effort_event
  - hr_effort_log
  - hr_effort_check

- subtitle: Limits, caching and replay
  desc: >
    Settings and spending limits, paying for a request once, and replaying a
    recorded run without a model. See `vignette("runs")`.
  contents:
  - hr_options
  - hr_governor
  - hr_cache
  - hr_cache_client
  - hr_cache_stats
  - hr_cache_clear
  - hr_replay_client

- subtitle: Compose steps and chains
  desc: >
    Build a run from steps, run them in order as one arm, derive a chain by
    dropping or replacing a step, list, change and sweep its settings by path,
    give a step a skill, and check a step's output by running a program. See
    `vignette("compose")`.
  contents:
  - hr_step
  - hr_chain
  - hr_settings
  - hr_set
  - hr_step_command
  - hr_skill

- subtitle: Benchmarks
  desc: >
    Compare configurations on a labelled reference: arms, sweeps of a setting,
    the reference and its splits, scorers, and repeated runs held to one
    spending limit. See `vignette("evaluate")` and `vignette("compare")`.
  contents:
  - hr_benchmark
  - hr_report
  - hr_error_correlation
  - hr_mdd
  - hr_contrast
  - hr_drift_check
  - hr_arm
  - hr_sweep
  - hr_sweep_check
  - hr_reference
  - hr_scorer
  - hr_assign_splits

- subtitle: Judges
  desc: >
    A model that chooses between candidates or grades one against a reference,
    asked in both orders, validated against blind human labels before it
    scores, with its accuracy corrected by those labels. See
    `vignette("evaluate")`.
  contents:
  - hr_judge
  - hr_judge_config
  - hr_judge_validate
  - hr_scorer_judge
  - hr_judge_ppi

- subtitle: Baselines
  desc: >
    Comparisons that use no model: tf-idf features, a cross-fitted classifier
    and a simulated active-learning ranker for screening. See
    `vignette("evaluate")`.
  contents:
  - hr_tfidf
  - hr_baseline_classifier
  - hr_baseline_ranker

- subtitle: Signal calibration
  desc: >
    The calibration records that measure how well a signal predicts being
    right, and the thresholds and policy that decide whether a signal may gate
    an action. Nothing gates by default. See `vignette("evaluate")`.
  contents:
  - hr_calibrate_signal
  - hr_calibration_valid
  - hr_gate_threshold
  - hr_signal_policy

- subtitle: Statistics
  desc: >
    Intervals for proportions, agreement between raters and coders, design-
    weighted and prediction-powered estimates, and the test of whether a
    model's labels can stand in for people's. See `vignette("evaluate")`.
  contents:
  - hr_prop_ci
  - hr_agreement
  - hr_ht_estimate
  - hr_ppi
  - hr_alt_test

- subtitle: Modules and the registry
  desc: >
    Register and list modules of any kind, declare what a module's run costs,
    and check a module against rules of your own. See `vignette("extending")`.
  contents:
  - hr_register
  - hr_modules
  - hr_cost
  - hr_check_module

- title: Documents
  desc: >
    The document layer, built on the core: ingest, segment, read, and review
    many documents. See `vignette("harnessr")` for a first question.

- subtitle: Ask a question
  desc: >
    One call reads a document and answers a question, and the answer says what
    it rests on and whether anything went wrong. See `vignette("harnessr")`.
  contents:
  - answer_document
  - gr_answer
  - is_not_found
  - gr_example
  - gr_recipes
  - gr_recipe
  - gr_compare
  - gr_methods_text

- subtitle: Get text out of files
  desc: >
    Extraction, cleaning and a survey of a folder before anything is spent.
    See `vignette("ingest")`.
  contents:
  - gr_ingest
  - gr_ingest_spec
  - gr_document
  - gr_extractors
  - gr_cleaners
  - gr_clean
  - gr_inventory
  - gr_flush_caches

- subtitle: Cut documents into chunks
  desc: >
    The segmenters, their settings, and the free statistics for comparing
    chunkings: size, boundary error against a reference (Pk and WindowDiff)
    and retrieval recall. See `vignette("segment")` and `vignette("compare")`.
  contents:
  - gr_segment
  - gr_segment_spec
  - gr_segmenters
  - gr_chunks
  - gr_chunk_stats
  - gr_seg_boundaries
  - gr_seg_pk
  - gr_seg_recall

- subtitle: Read the chunks
  desc: >
    The reading strategies, the settings that choose and place chunks, the
    embedders that rank them, and the check on quoted evidence. See
    `vignette("readers")`.
  contents:
  - gr_read
  - gr_read_spec
  - gr_readers
  - gr_reader_signature
  - gr_embedders
  - gr_verify_evidence

- subtitle: Many documents and literature reviews
  desc: >
    One question over many documents, and a review from a search export to
    screened studies, an extraction table, a written review and an audit
    report, with the screening measured against a hand-screened sample and a
    stopping test for prioritised screening. See `vignette("review")`.
  contents:
  - gr_read_many
  - gr_protocol
  - gr_protocols
  - gr_protocol_save
  - gr_register_protocol
  - gr_search
  - gr_records
  - gr_search_recall
  - gr_screen
  - gr_reference
  - gr_reference_consensus
  - gr_calibrate
  - gr_screen_sample_size
  - gr_stop_test
  - gr_resolve
  - '`[.gr_reference_frame`'
  - gr_fields
  - gr_field
  - gr_extract
  - gr_extract_agreement
  - gr_claims
  - gr_outline
  - gr_outline_pick
  - gr_gaps
  - gr_synthesise
  - gr_recheck
  - gr_flow
  - gr_audit_report

- subtitle: Document arms, steps and references
  desc: >
    Document arms and steps for the core benchmarks and chains, question-
    answer references, label sheets, and the checks on what a reader keeps.
    See `vignette("evaluate")` and `vignette("compose")`.
  contents:
  - gr_arm
  - gr_step
  - gr_qa_reference
  - gr_scorer_answer
  - gr_condensation_check
  - gr_reverse_text
  - gr_label_sheet
  - gr_read_labels

- subtitle: Settings of the document stages
  desc: >
    The settings of a read, segment or ingest spec, and every setting of every
    stage in one table. See `vignette("settings")`.
  contents:
  - gr_settings
  - gr_settings_table

- subtitle: Extending the document layer
  desc: >
    Every document axis is a registry, and an addition is used exactly like a
    built-in. Register extractors, cleaners, segmenters, readers and
    embedders, build the objects they return, and check them against the
    contract. See `vignette("extending")`.
  contents:
  - gr_register_extractor
  - gr_register_cleaner
  - gr_register_segmenter
  - gr_register_reader
  - gr_register_embedder
  - new_chunks
  - new_answer
  - gr_check_reader
  - gr_check_segmenter
