# Builds the website (the README, the guides, the reference and NEWS) with
# pkgdown, and publishes it to the gh-pages branch, which GitHub Pages serves.
#
# Pull requests build the site without publishing it, so a guide that fails to
# knit shows up before it is merged. The guides run offline with a stand-in
# model, so no API key is needed; OPENAI_API_KEY is set empty to make sure of it.
#
# A pull request builds the site only when it changes a file the site is made
# from: the code and its help pages, the guides, the installed files they
# read, and the pages pkgdown copies (README, NEWS, CONTRIBUTING, LICENSE).
# A push to main always builds and publishes.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'inst/**'
      - 'README.md'
      - 'NEWS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # A slow package mirror once held a successful build for 64 minutes.
    timeout-minutes: 75
    # One publishing run at a time, never cancelled. A pull request does not
    # publish: a new push to it cancels its older build.
    concurrency:
      group: pkgdown-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'true' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
