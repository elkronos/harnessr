name: pr-checks

# Checks on what a pull request changes, as opposed to whether the package
# works. Each one is a step of dev/ci/pr-checks.R, which runs the same way
# locally against any two refs:
#
#   Rscript dev/ci/pr-checks.R tests origin/main HEAD
#
# tests  A pull request may not drop an expect_*() call from tests/, add a
#        skip(), skip_if*() or skip_on_*() call, or add a row to a list that
#        may only shrink (fixtures/boundary/allowed.csv and
#        doc-uses-internal.csv) without the label tests-reviewed. An expect_
#        line that is edited counts as removed.
# deps   A pull request may not add a package to Depends, Imports, LinkingTo
#        or Suggests without the label deps-reviewed, and every package it
#        adds must be on CRAN.
# namespace
#        A pull request may not remove an export() from NAMESPACE without the
#        label exports-reviewed.
# commits
#        No commit message in the pull request may carry a Co-Authored-By
#        trailer, a chat or session link, or a "Generated with" line. No label
#        allows it; reword the commit. Only commit messages are read.
#
# The four checks need base R only, so they share one job and one R setup.
# Each is its own step and runs even when an earlier one failed, so a red
# job shows every failing check; the step name says which. Lint needs lintr
# and reads no label, so it runs in pr-lint.yaml.
#
# Adding or removing a label reruns the checks, so a label added after review
# turns a red check green without a new push.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  checks:
    name: pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The diff is taken from the merge base, and every commit of the
          # pull request is read, which needs the history.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: "tests: no weakened tests"
        if: ${{ !cancelled() }}
        run: Rscript dev/ci/pr-checks.R tests "$BASE_SHA" "$HEAD_SHA"
        shell: bash

      - name: "deps: no unreviewed dependencies"
        if: ${{ !cancelled() }}
        run: Rscript dev/ci/pr-checks.R deps "$BASE_SHA" "$HEAD_SHA"
        shell: bash

      - name: "namespace: no unreviewed export removals"
        if: ${{ !cancelled() }}
        run: Rscript dev/ci/pr-checks.R namespace "$BASE_SHA" "$HEAD_SHA"
        shell: bash

      - name: "commits: no attribution in commit messages"
        if: ${{ !cancelled() }}
        run: Rscript dev/ci/pr-checks.R commits "$BASE_SHA" "$HEAD_SHA"
        shell: bash
