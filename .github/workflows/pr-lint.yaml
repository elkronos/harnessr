name: pr-lint

# lintr, with the repository's .lintr, on the files under R/ that a pull
# request changes. Run it locally with
#
#   Rscript dev/ci/pr-checks.R lint origin/main HEAD
#
# Lint reads no label, so unlike pr-checks.yaml it does not rerun when a
# label is added or removed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  lint:
    name: lint changed R files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The diff is taken from the merge base, which needs the history.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Only lintr. None of the linters in .lintr need the package itself
          # installed, so its dependencies are not. lintr is pinned to the
          # version R/ was checked against with zero lints; newer releases
          # widen some linters, so raise it on purpose and fix what it finds.
          packages: lintr@3.1.1

      - name: Lint changed files under R/
        run: Rscript dev/ci/pr-checks.R lint "$BASE_SHA" "$HEAD_SHA"
        shell: bash
